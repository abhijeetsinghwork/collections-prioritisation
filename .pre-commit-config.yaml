# Local hooks only: they run the pinned tool versions from uv.lock.
repos:
  - repo: local
    hooks:
      - id: block-data
        name: block files under data/ (Freddie Mac terms forbid redistribution)
        entry: bash -c 'echo "Refusing to commit data files:"; printf "  %s\n" "$@"; exit 1' --
        language: system
        files: ^data/
      - id: block-loan-level-outputs
        name: block parquet / large CSV outputs
        entry: bash -c 'echo "Refusing to commit loan-level outputs:"; printf "  %s\n" "$@"; exit 1' --
        language: system
        files: \.(parquet|txt\.gz|zip)$
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check --force-exclude
        language: system
        types: [python]
