name: ci

on:
  push:
  pull_request:

jobs:
  check:
    # Lint, type-check and unit tests on synthetic fixtures. The pipeline itself
    # cannot run here: the Freddie Mac data is not redistributable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: make lint

      - name: Type-check
        run: make typecheck

      - name: Test
        run: make test
