# Single source of every tunable parameter. Loaded and validated once by
# src/utils/config.py; unknown keys fail at startup.

random_seed: 20260105

paths:
  raw_dir: data/raw
  layout_file: data/raw/docs/file_layout_july_2026.xlsx
  orig_glob: sample_orig_{vintage}.txt
  perf_glob: sample_perf_{vintage}.txt
  panel_dir: data/interim/panel
  labels_dir: data/processed/labels
  macro_dir: data/raw/macro
  features_dir: data/processed/features
  feature_audit_table: outputs/tables/feature_audit.csv
  models_dir: data/processed/models
  scores_dir: data/processed/scores
  tables_dir: outputs/tables
  figures_dir: outputs/figures
  test_log: outputs/tables/test_evaluations.csv
  schema_module: src/utils/schema.py

spark:
  master: local[*]
  driver_memory: 8g            # roughly half of a 16GB machine
  shuffle_partitions: 64
  session_timezone: UTC
  # PySpark 3.5 supports Java 8/11/17 only. Used when JAVA_HOME is unset.
  supported_java_majors: [8, 11, 17]
  java_home_candidates:
    - /opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
    - /usr/local/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home

ingest:
  # Vintages ingested by `make ingest`. Override on the CLI with --vintages.
  vintages: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009,
             2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019,
             2020, 2021, 2022, 2023, 2024]
  delimiter: "|"

  # Not-available sentinels, per the SFLLD General User Guide (July 2026).
  # Compared against the trimmed raw string before type casting.
  sentinels:
    credit_score: ["9999"]
    vantage_score: ["9999"]
    first_time_homebuyer: ["9"]
    mi_pct: ["999"]
    num_units: ["99"]
    occupancy_status: ["9"]
    orig_cltv: ["999"]
    orig_dti: ["999"]
    orig_ltv: ["999"]
    channel: ["9"]
    property_type: ["99"]
    postal_code: ["000"]
    loan_purpose: ["9"]
    num_borrowers: ["99"]
    property_valuation_method: ["7"]
    eltv: ["999"]
    mi_cancellation_indicator: ["7"]

  delinquency:
    unknown_code: "XX"          # mapped to null; rows excluded from the panel
    reo_code: "RA"              # REO acquisition; terminal
    bucket_cap: 4               # dq_bucket = min(months delinquent, cap) -> "4+"
    reo_bucket: 4               # REO is deeper than any delinquency bucket

  # Columns carried into the panel. Post-disposition loss fields (actual loss,
  # recoveries, expenses, net sale proceeds) are dropped here on purpose: they
  # are only populated after the outcome and can only ever leak.
  retain_origination:
    - loan_sequence_number
    - vintage
    - credit_score
    - first_time_homebuyer
    - first_payment_date
    - maturity_date
    - msa
    - mi_pct
    - num_units
    - occupancy_status
    - orig_cltv
    - orig_dti
    - orig_upb
    - orig_ltv
    - orig_interest_rate
    - channel
    - property_state
    - property_type
    - loan_purpose
    - orig_loan_term
    - num_borrowers
  retain_performance:
    - loan_sequence_number
    - reporting_period
    - reporting_year
    - current_upb
    - delinquency_status
    - dq_months
    - dq_bucket
    - is_reo
    - loan_age
    - remaining_months_to_maturity
    - modification_flag
    - zero_balance_code
    - zero_balance_effective_date
    - current_interest_rate
    - current_deferred_upb
    - current_interest_bearing_upb
    - step_modification_flag
    - payment_deferral_flag
    - eltv
    - delinquency_due_to_disaster
    - borrower_assistance_status
    - servicer_name

checks:
  # Spec section 5: if current does not dominate, the status mapping is wrong.
  min_current_share: 0.95
  spot_check_loans: 5
  # Stage 2 structural checks. Bounds only reject a degenerate label (all 0 or
  # all 1); they are not a target.
  base_rate_bounds: [0.01, 0.99]
  min_rows_per_split: 10000
  # Splits where base rate must rise with bucket depth. The drift and late
  # windows are reported but not asserted: the drift window exists precisely
  # because forbearance changes what delinquency means.
  monotonic_splits: [train, validation, test]
  trace_examples_per_label: 3

labels:
  population_buckets: [1, 2, 3]   # 30-119 days; current and 120+ are out of scope
  horizon_months: 3
  # Zero Balance Code classification. Codes from the July 2026 guide.
  zero_balance_codes:
    "01": cure       # prepaid or matured
    "02": roll       # third party sale
    "03": roll       # short sale or charge off
    "09": roll       # REO disposition
    "15": roll       # whole loan sale
    "16": exclude    # reperforming loan securitisation: a sale, not an observed outcome
    "96": exclude    # confirmed underwriting / servicing defect

# Temporal splits on reporting period (inclusive, YYYY-MM), in time order.
# A loan is kept only in the first split it appears in, so splits are disjoint.
splits:
  - {name: train,        start: "2000-01", end: "2015-12"}
  - {name: validation,   start: "2016-01", end: "2017-12"}
  - {name: test,         start: "2018-01", end: "2019-12"}
  - {name: drift_study,  start: "2020-01", end: "2021-12"}   # never trained or tested on
  - {name: late_holdout, start: "2022-01", end: "2024-12"}   # optional second test window

features:
  # Trajectory windows look only at months strictly before T (window end = T-1),
  # on a calendar month index so missing months cannot stretch a window.
  trajectory_windows: [3, 6, 12]
  event_windows: [6, 12]
  upb_change_windows: [3, 6, 12]
  velocity_lag: 3
  bucket_lags: [1, 2, 3]

  macro:
    url: "https://fred.stlouisfed.org/graph/fredgraph.csv?id={series}"
    state_series:                  # {state} is the two-letter property state
      unemployment_rate: "{state}UR"
      house_price_index: "{state}STHPI"
    national_series:
      mortgage_rate_30y: MORTGAGE30US
    # Months after the observation date before a value is public, so month T
    # only sees what was known then. UR: state data publish ~3-7 weeks after
    # month end. STHPI: quarterly, dated at quarter start, published ~2 months
    # after quarter end. MORTGAGE30US: weekly; monthly mean known at month end.
    publication_lag_months:
      unemployment_rate: 2
      house_price_index: 5
      mortgage_rate_30y: 1
    change_windows: [3, 12]

  audit:
    # Univariate AUC: each feature fit alone on train, scored on validation.
    tree_max_leaf_nodes: 16
    tree_min_samples_leaf: 500
    encoding_smoothing: 100        # target-mean encoding prior weight (categoricals)

  # Explicit keep/drop decision for every candidate feature, with a reason.
  # Stage 3 fails if a candidate has no decision. Filled after reviewing the
  # null-rate and single-feature AUC tables.
  decisions:
    credit_score: {keep: true, reason: "weak univariately among already-delinquent loans (valid .49) but a standard risk driver; kept for the model to use in interactions"}
    orig_ltv: {keep: true, reason: "origination attribute, known from day one"}
    orig_cltv: {keep: true, reason: "origination attribute, known from day one"}
    orig_dti: {keep: true, reason: "null rate jumps 6% -> 26% in validation (HARP loans have no DTI); kept, native null handling, watch in drift study"}
    orig_upb: {keep: true, reason: "origination attribute, known from day one"}
    orig_interest_rate: {keep: true, reason: "origination attribute, known from day one"}
    orig_loan_term: {keep: true, reason: "origination attribute, known from day one"}
    mi_pct: {keep: true, reason: "origination attribute, known from day one"}
    loan_purpose: {keep: true, reason: "origination attribute, known from day one"}
    occupancy_status: {keep: true, reason: "origination attribute, known from day one"}
    channel: {keep: true, reason: "origination attribute, known from day one"}
    property_type: {keep: true, reason: "origination attribute, known from day one"}
    num_units: {keep: true, reason: "origination attribute, known from day one"}
    num_borrowers: {keep: true, reason: "origination attribute, known from day one"}
    first_time_homebuyer: {keep: true, reason: "origination attribute, known from day one"}
    property_state: {keep: true, reason: "origination attribute, known from day one"}
    msa: {keep: false, reason: "high-cardinality (~400 codes), 24% null; overfits univariately (train .56 -> valid .51); property_state carries geography"}
    dq_bucket: {keep: true, reason: "bucket at T defines the population and is known at T; top AUC (.66) is in line with its trajectory neighbours, no leakage signature"}
    loan_age: {keep: true, reason: "reported for month T, known at T"}
    current_upb: {keep: true, reason: "balance at T; kept as a risk feature (also the exposure multiplier in the score)"}
    current_interest_rate: {keep: true, reason: "reported for month T, known at T"}
    remaining_months_to_maturity: {keep: true, reason: "reported for month T, known at T"}
    current_deferred_upb: {keep: true, reason: "reported for month T, known at T"}
    eltv: {keep: false, reason: "only populated from 2017-04: 100% null in train, so nothing to learn"}
    modification_flag: {keep: true, reason: "null = never modified is meaningful (Y current / P prior)"}
    step_modification_flag: {keep: false, reason: "duplicates modification_flag (identical null pattern and AUC); only defined after a modification"}
    payment_deferral_flag: {keep: false, reason: "only populated from 2020: 100% null in train"}
    borrower_assistance_status: {keep: false, reason: "only populated from 2014: 99% null in train; revisit if the training window moves"}
    delinquency_due_to_disaster: {keep: false, reason: "only populated from 2014: 99.95% null in train; inverts on validation (AUC .44)"}
    upb_to_orig_upb: {keep: true, reason: "reported for month T, known at T"}
    rate_change_since_orig: {keep: true, reason: "reported for month T, known at T"}
    months_delinquent_last_3: {keep: true, reason: "window ends at T-1 or earlier (registry + perturbation test)"}
    max_bucket_last_3: {keep: true, reason: "window ends at T-1 or earlier (registry + perturbation test)"}
    mean_bucket_last_3: {keep: true, reason: "window ends at T-1 or earlier (registry + perturbation test)"}
    months_delinquent_last_6: {keep: true, reason: "window ends at T-1 or earlier (registry + perturbation test)"}
    max_bucket_last_6: {keep: true, reason: "window ends at T-1 or earlier (registry + perturbation test)"}
    mean_bucket_last_6: {keep: true, reason: "window ends at T-1 or earlier (registry + perturbation test)"}
    months_delinquent_last_12: {keep: true, reason: "window ends at T-1 or earlier (registry + perturbation test)"}
    max_bucket_last_12: {keep: true, reason: "window ends at T-1 or earlier (registry + perturbation test)"}
    mean_bucket_last_12: {keep: true, reason: "window ends at T-1 or earlier (registry + perturbation test)"}
    months_observed_last_12: {keep: true, reason: "data-availability count (seasoning < 12 months or gaps); kept, low risk"}
    n_cure_events_last_6: {keep: true, reason: "window ends at T-1 or earlier (registry + perturbation test)"}
    n_roll_events_last_6: {keep: true, reason: "window ends at T-1 or earlier (registry + perturbation test)"}
    n_cure_events_last_12: {keep: true, reason: "window ends at T-1 or earlier (registry + perturbation test)"}
    n_roll_events_last_12: {keep: true, reason: "window ends at T-1 or earlier (registry + perturbation test)"}
    bucket_lag_1: {keep: true, reason: "window ends at T-1 or earlier (registry + perturbation test)"}
    bucket_lag_2: {keep: true, reason: "window ends at T-1 or earlier (registry + perturbation test)"}
    bucket_lag_3: {keep: true, reason: "window ends at T-1 or earlier (registry + perturbation test)"}
    months_since_last_current: {keep: true, reason: "window ends at T-1 or earlier (registry + perturbation test)"}
    months_since_first_delinquency: {keep: true, reason: "null = no delinquency before T (first episode) is meaningful; LightGBM uses nulls natively"}
    longest_delinquent_run_before_t: {keep: true, reason: "null = no delinquency before T is meaningful; native null handling"}
    times_entered_delinquency_before_t: {keep: true, reason: "window ends at T-1 or earlier (registry + perturbation test)"}
    max_bucket_before_t: {keep: true, reason: "window ends at T-1 or earlier (registry + perturbation test)"}
    ever_modified_before_t: {keep: true, reason: "window ends at T-1 or earlier (registry + perturbation test)"}
    ever_forbearance_before_t: {keep: false, reason: "derived from borrower_assistance_status (2014+): 98% null in train"}
    ever_payment_deferral_before_t: {keep: false, reason: "no variance in train (deferrals start 2020)"}
    ever_disaster_before_t: {keep: false, reason: "derived from the 2014+ disaster flag: 99.9% null in train"}
    delinquency_velocity_3m: {keep: true, reason: "reads T by definition (bucket T vs T-3); both known at T; perturbation test confirms nothing later is read"}
    upb_change_pct_3: {keep: true, reason: "reads T by definition (balance T vs T-3); balance at T is reported for T"}
    upb_change_pct_6: {keep: true, reason: "reads T by definition (balance T vs T-6)"}
    upb_change_pct_12: {keep: true, reason: "reads T by definition (balance T vs T-12)"}
    current_run_length: {keep: true, reason: "reads T by definition (run ending at T); known at T"}
    unemployment_rate: {keep: true, reason: "state-level, comparable across states, varies within a month"}
    unemployment_rate_chg_3m: {keep: true, reason: "state-level change, varies within a month"}
    unemployment_rate_chg_12m: {keep: true, reason: "state-level change, varies within a month"}
    house_price_index: {keep: false, reason: "index level has a different base per state, so it encodes state x time, not house-price stress"}
    house_price_index_chg_3m: {keep: true, reason: "state-level, varies within a month; percent change is comparable across states"}
    house_price_index_chg_12m: {keep: true, reason: "state-level, varies within a month; inverts on validation (train .58, valid .47) because 2016-17 had rising prices everywhere; kept for the model, flagged for the drift study"}
    mortgage_rate_30y: {keep: false, reason: "national: identical for every loan in a month, cannot change the within-month ranking; time proxy"}
    mortgage_rate_30y_chg_3m: {keep: false, reason: "national: identical for every loan in a month, cannot change the within-month ranking; time proxy"}
    mortgage_rate_30y_chg_12m: {keep: false, reason: "national: identical for every loan in a month, cannot change the within-month ranking; time proxy"}

tracking:
  # MLflow 3.16 refuses the file store the spec names; SQLite is its local
  # replacement. Everything stays under mlruns/, which is git-ignored.
  mlflow_tracking_uri: sqlite:///mlruns/mlflow.db
  mlflow_artifact_dir: mlruns/artifacts
  mlflow_experiment: collections-prioritisation

models:
  # Base rate in train is ~0.40 (Stage 2): not imbalanced, so no resampling
  # and no scale_pos_weight, both of which would damage calibration.
  lightgbm:
    params:
      objective: binary
      metric: auc
      learning_rate: 0.03
      num_leaves: 63
      min_data_in_leaf: 200
      feature_fraction: 0.8
      bagging_fraction: 0.8
      bagging_freq: 5
      lambda_l2: 1.0
      deterministic: true
      force_row_wise: true
      verbosity: -1
    num_boost_round: 3000
    early_stopping_rounds: 100
  woe_logistic:
    max_n_prebins: 20
    min_prebin_size: 0.02
    C: 1.0
    max_iter: 2000
  segment_buckets: [1, 2, 3]
  # Segmented models are chosen over the pooled one only if they beat it on
  # validation AUC by at least this much; otherwise the simpler pooled model
  # wins. Set after the first validation run showed a 0.0004 difference,
  # before any test evaluation (see methodology).
  segmented_min_auc_gain: 0.005
  calibration:
    reliability_bins: 10
    decile_bins: 10
    # Method choice, added after isotonic (fit on all of validation) worsened
    # test calibration. Decided without test: fit each method on validation
    # minus its last N months, score those last N months. Choose the lowest
    # held-out ECE among methods that beat raw on BOTH Brier and ECE; raw if
    # none does. The chosen method is then refit on all of validation.
    transfer_holdout_months: 12
    methods: [isotonic, platt, intercept_shift]
  importance_top_n: 20
  # Structural test-phase check: validation and test AUC in the same
  # neighbourhood. A tolerance, not a target.
  max_val_test_auc_gap: 0.05
